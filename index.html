<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ping Pong Game</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <main>
        <section class="main-menu">
            <h1>Ping Pong</h1>

            <div class="menu-btn">
                <button class="btn-play" id="play-btn">CHƠI NGAY</button>
                <button class="btn-select-level" id="select-level">CHỌN MÀN CHƠI</button>
                <button class="btn-how-to-pay">HƯỚNG DẪN CHƠI</button>
            </div>
        </section>



        <section class="choose-level">
            <h2>CHỌN MÀN CHƠI</h2>


            <div class="levels">
                <button class="btn-level">1</button>
                <button class="btn-level">2</button>
                <button class="btn-level">3</button>
                <button class="btn-level">4</button>
                <button class="btn-level">5</button>
                <button class="btn-level">6</button>
            </div>


            <button class="btn-back" id="choose-level-back">QUAY LẠI</button>
        </section>

        <section class="game-screen">
            <div class="game-info">
                <span>MÀNG: 0</span>
                <span>ĐIỂM: <span id="score">0</span></span>
                <span>MẠNG: <span id="live">3</span> </span>
            </div>


            <div class="game-board">
<!--                <div class="brick"></div>-->
                <div class="ball"></div>
                <div class="paddle"></div>


                <div class="game-over">
                    <h4>TRÒ CHƠI KẾT THÚC</h4>

                    <p>Điểm: <span id="final-score">0</span> </p>
                    <div class="game-over-button">
                        <button class="again-btn">Chơi lại</button>
                        <button class="back-to-menu">Trang chủ</button>
                    </div>
                </div>


                <div class="win-game">
                    <h4>CHIẾN THẮNG</h4>
                    <p>Điểm: <span id="win-score">0</span> </p>

                    <div class="game-over-button">
                        <button class="next-level">Màn kế</button>
                        <button class="again-btn">Chơi lại</button>
                        <button class="back-to-menu">Trang chủ</button>
                    </div>
                </div>
            </div>
        </section>




    </main>

    <script src="main.js"></script>
</body>
</html>
